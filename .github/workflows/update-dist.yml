# Periodically regenerates the transpiled JavaScript in `dist/` and opens (or
# updates) a pull request if the output differs from what is checked in. This
# keeps `dist/` in sync with `src/` and dependency updates (e.g. Dependabot).
name: Update Transpiled JavaScript

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-dist:
    name: Update dist/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Build dist/ Directory
        id: build
        run: npm run bundle

      # Only `dist/` is committed; any other changes (e.g. from formatting)
      # are ignored.
      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: dist/**
          branch: automation/update-dist
          delete-branch: true
          commit-message: Regenerate transpiled JavaScript in dist/
          title: Regenerate transpiled JavaScript in dist/
          body: |
            This PR was automatically generated by the
            `${{ github.workflow }}` workflow (run ${{ github.run_id }}).

            Running `npm run bundle` on `${{ github.ref_name }}` produced
            changes to the transpiled JavaScript in `dist/`.
